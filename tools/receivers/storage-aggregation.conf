# Rollup (10 s archive rolled up into the 60 s archive) for the local go-carbon test receiver.
# First matching section wins (go-carbon persister/whisper_aggregation.go).
# xFilesFactor = 0: keep a rollup value even if only one 10 s point in the
# 60 s window exists (the hub may send far less often than every 10 s).

[min]
# metrics that already carry a minimum (e.g. *_min) must stay a minimum
pattern = _min$
xFilesFactor = 0
aggregationMethod = min

[max]
# metrics that already carry a maximum (e.g. *_max) must stay a maximum
pattern = _max$
xFilesFactor = 0
aggregationMethod = max

[default]
pattern = .*
xFilesFactor = 0
aggregationMethod = average
