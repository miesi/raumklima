# Retention for the local go-carbon test receiver.
# First matching section wins (go-carbon persister/whisper_schema.go).
# The hub sends every 10 s .. 3600 s; 10 s is the finest resolution needed.
# A point sent less often than every 10 s simply leaves gaps in the 10 s archive.

[default]
pattern = .*
# 10 s resolution for 7 days, then 60 s resolution for 90 days
retentions = 10s:7d,60s:90d
